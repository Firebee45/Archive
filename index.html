<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireBee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="Landing page/assets/css/styles.css" />
    <script type="text/javascript" src="https://storage.ko-fi.com/cdn/widget/Widget_2.js"></script>
    <style>
      .kofi-support {display: flex;justify-content: center;margin: 1.25rem auto 1.75rem;}
      .kofi-support iframe,
      .kofi-support > div,
      .kofi-support a {border-radius: 999px;overflow: hidden;box-shadow: 0 0 18px rgba(235, 118, 0, 0.35);transition: transform 0.2s ease, box-shadow 0.2s ease;}
      .kofi-support:hover iframe,
      .kofi-support:hover > div,
      .kofi-support:hover a {transform: translateY(-2px);box-shadow: 0 0 26px rgba(235, 118, 0, 0.55);}
    </style>
  </head>
  <body>
    <canvas id="emberCanvas"></canvas>

    <firebee-nav></firebee-nav>

    <main>
      <firebee-hero></firebee-hero>
      <firebee-profile></firebee-profile>
      <firebee-archive></firebee-archive>

      <footer id="contact">
        <p class="copy" id="footerCopy"></p>
      </footer>
    </main>

    <script type="module" src="Landing page/assets/app.js"></script>
  </body>
</html>
