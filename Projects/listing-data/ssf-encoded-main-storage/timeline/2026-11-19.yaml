content: "<!-- update-timestamp: 2026-11-19T00:39:26.961000+00:00 -->\r\n**Splitter Nonstackable filtering**\r\n\r\nIt’s hella messy but it works and I don’t care. To explain what’s happening here I think it’s best to just explain the flow. \r\n\r\n```ansi\r\n[1;37m Splitter Non-Stackable Remover Logic\u001b[0m\r\n          │\r\n          │\r\n    Splitter Output\r\n          │\r\n          │\r\n   Is Fill Level ≤ 1?\r\n     ├── \u001b[1;32mYES\u001b[0m\r\n     │    │\r\n     │    Continue to\r\n     │    Empty Check\r\n     │\r\n     └── \u001b[1;31mNO\u001b[0m\r\n          │\r\n          Send Cart to Output\r\n          │\r\n          │\r\n      Is Cart Empty?\r\n     ├── \u001b[1;32mYES\u001b[0m\r\n     │    │\r\n     │    Send Cart to\r\n     │    Empty Output\r\n     │\r\n     └── \u001b[1;31mNO\u001b[0m\r\n          │\r\n          Continue to\r\n          Non-Stackable\r\n          Removers\r\n          │\r\n          │\r\n   Non-Stackable Removers\r\n   (2 Used to Handle Maximum\r\n   Output of 64 GT per Cart,\r\n   Especially with Multiple\r\n   Single-Item Stacks in a Row)\r\n          │\r\n          │\r\n      Is Cart Empty?\r\n     ├── \u001b[1;32mYES\u001b[0m\r\n     │    │\r\n     │    Send Cart to\r\n     │    Empty Cart Output\r\n     │\r\n     └── \u001b[1;31mNO\u001b[0m\r\n          │\r\n          Send Cart to Output\r\n ```\r\n\r\nEmpty carts get sent directly back to the empty cart storage\r\n\r\n[View Discord message](https://discord.com/channels/@me/1520002350708686899/1572776237917675530)\r\n\r\n## Media\r\n\r\n![area_render_26_.png](../assets/area_render_26_.png)\r\n![area_render_29_.png](../assets/area_render_29__2.png)\r\n"
